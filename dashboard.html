<!doctype html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dashboard — My Future Letter</title><link rel="stylesheet" href="assets/style.css"></head><body><header class="topbar"><a class="brand" href="index.html"><img src="https://my-future-letter.github.io/futureletter/my-picture/my-future-letter-logo.png"><span>My Future Letter</span></a><div><select id="langQuick" class="select" style="width:auto;display:inline-block;padding:9px"><option value="bn">বাংলা</option><option value="en">English</option></select><a class="btn ghost" href="setup.html" data-i18n="profile">Profile</a><button id="logout" class="btn ghost" data-i18n="logout">Log out</button></div></header><main class="container"><div class="toolbar"><div><h1 class="page-title" data-i18n="dashboard">Dashboard</h1><p id="who" class="muted"></p></div><a class="btn primary" href="create.html" data-i18n="create">New Letter</a></div><div id="letters" class="list"></div><section class="card" style="margin-top:18px"><h2 data-i18n="photos">Photos</h2><p class="muted">Photo library management will keep photos independent from letter deletion.</p><div id="photos" class="photo-grid"></div></section></main><script src="js/i18n.js"></script><script type="module">
import {auth,onAuthStateChanged,db,doc,getDoc,collection,query,where,getDocs,deleteDoc,signOut,updateDoc} from "./js/firebase.js";
let user;(auth,async u=>{if(!u)return location.href="login.html";user=u;const us=await getDoc(doc(db,"users",u.uid));const p=us.data()||{};localStorage.setItem("mfl_lang",p.language||"bn");applyI18n();langQuick.value=p.language||"bn";who.textContent=(p.name||u.email)+" · @"+(p.username||"");const q=await getDocs(query(collection(db,"letters"),where("uid","==",u.uid)));letters.innerHTML="";q.forEach(s=>{const x=s.data();const d=document.createElement("article");d.className="card letter-card";d.innerHTML=`<div><strong>${escapeHtml(x.title||"Untitled")}</strong><div class="muted">${x.status||"draft"} · ${x.futureDate||""}</div></div><div class="actions"><a class="btn secondary" href="create.html?id=${s.id}">${t("edit")}</a>${x.status==="published"?`<a class="btn ghost" target="_blank" href="${x.publicUrl||"#"}">Open</a>`:""}</div>`;letters.appendChild(d)});if(!letters.children.length)letters.innerHTML=`<div class="card empty">${t("create")}</div>`});
langQuick.onchange=async()=>{localStorage.setItem("mfl_lang",langQuick.value);await updateDoc(doc(db,"users",user.uid),{language:langQuick.value});applyI18n();}
logout.onclick=()=>signOut(auth).then(()=>location.href="index.html");
function escapeHtml(s){return s.replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]))}
</script></body></html>
