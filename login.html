<!doctype html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sign in — My Future Letter</title><link rel="stylesheet" href="assets/style.css"></head><body><main class="authbox"><div class="card center"><img src="https://my-future-letter.github.io/futureletter/my-picture/my-future-letter-logo.png" width="80" style="border-radius:20px"><h1>My Future Letter</h1><p class="muted" data-i18n="heroText"></p><button id="google" class="btn primary" style="width:100%" data-i18n="signIn">Sign in</button><p id="msg" class="notice" hidden></p></div></main><script src="js/i18n.js"></script><script type="module">
import {auth,provider,signInWithPopup,doc,getDoc,setDoc,db} from "./js/firebase.js";
document.getElementById("google").onclick=async()=>{try{const r=await signInWithPopup(auth,provider);const ref=doc(db,"users",r.user.uid);const snap=await getDoc(ref);if(!snap.exists())await setDoc(ref,{name:r.user.displayName||"",email:r.user.email||"",photoURL:r.user.photoURL||"",language:"bn",createdAt:new Date().toISOString()});location.href="setup.html"}catch(e){const m=document.getElementById("msg");m.hidden=false;m.textContent=e.message}}
</script></body></html>
