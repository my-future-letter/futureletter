<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Create your username — My Future Letter</title><link rel="stylesheet" href="./css/app.css"></head><body><main class="container"><div class="card auth-card"><div style="text-align:center"><img class="logo-center" src="https://my-future-letter.github.io/futureletter/my-picture/my-future-letter-logo.png"><h1>One small step before your first letter</h1><p class="muted">Choose a unique username. This becomes part of your public future-letter address.</p></div><div class="field"><label>Your name</label><input id="name" placeholder="Your name"></div><div class="field"><label>Username</label><input id="username" placeholder="muhammedomor" autocomplete="off"><small class="muted">3–24 English letters and numbers. No spaces.</small></div><button id="claim" class="btn primary" style="width:100%">Continue</button><p id="msg" class="error"></p></div></main><script type="module">import {auth,onAuthStateChanged,httpsCallable} from './js/firebase.js';import {slugify} from './js/security.js';const u=await new Promise(r=>onAuthStateChanged(auth,x=>r(x)));if(!u)location.href='login.html';const n=document.querySelector('#name'),un=document.querySelector('#username');n.value=u.displayName||'';n.oninput=()=>{if(!un.dataset.edited)un.value=slugify(n.value)};un.oninput=()=>un.dataset.edited='1';document.querySelector('#claim').onclick=async()=>{const name=n.value.trim()||u.displayName||'Future Writer',username=slugify(un.value);if(username.length<3){document.querySelector('#msg').textContent='Please choose a longer username.';return}try{await httpsCallable((await import('./js/firebase.js')).functions,'claimUsername')({name,username});location.href='dashboard.html'}catch(e){document.querySelector('#msg').textContent=e.message||'Username could not be claimed.'}};</script></body></html>
