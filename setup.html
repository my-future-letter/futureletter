<!doctype html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Profile — My Future Letter</title><link rel="stylesheet" href="assets/style.css"></head><body><main class="authbox"><div class="card"><h1 data-i18n="profile">Profile</h1><p class="muted">Choose your website language.</p><div class="form"><label class="label" data-i18n="username">Username</label><input id="username" class="input" placeholder="muhammedomor" pattern="[a-z0-9_]{3,24}"><label class="label" data-i18n="language">Language</label><select id="lang" class="select"><option value="bn">বাংলা</option><option value="en">English</option></select><button id="save" class="btn primary" data-i18n="save">Save</button><p id="msg" class="notice" hidden></p></div></div></main><script src="js/i18n.js"></script><script type="module">
import {auth,onAuthStateChanged,db,doc,getDoc,setDoc} from "./js/firebase.js";
let user; onAuthStateChanged(auth,async u=>{if(!u)return location.href="login.html";user=u;const s=await getDoc(doc(db,"users",u.uid));if(s.exists()){username.value=s.data().username||"";lang.value=s.data().language||"bn";localStorage.setItem("mfl_lang",lang.value);applyI18n()}});
save.onclick=async()=>{const u=username.value.trim().toLowerCase();if(!/^[a-z0-9_]{3,24}$/.test(u)){msg.hidden=false;msg.textContent="Username: 3–24 lowercase letters, numbers or underscore.";return}const existing=await getDoc(doc(db,"usernames",u));if(existing.exists()&&existing.data().uid!==user.uid){msg.hidden=false;msg.textContent="Username already taken.";return}await setDoc(doc(db,"usernames",u),{uid:user.uid});await setDoc(doc(db,"users",user.uid),{username:u,language:lang.value,name:user.displayName||"",email:user.email||"",photoURL:user.photoURL||"},{merge:true});localStorage.setItem("mfl_lang",lang.value);location.href="dashboard.html"};
lang.onchange=()=>{localStorage.setItem("mfl_lang",lang.value);applyI18n()};
</script></body></html>
