<!doctype html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Create — My Future Letter</title><link rel="stylesheet" href="assets/style.css"></head><body><header class="topbar"><a class="brand" href="dashboard.html"><img src="https://my-future-letter.github.io/futureletter/my-picture/my-future-letter-logo.png"><span>My Future Letter</span></a><a class="btn ghost" href="dashboard.html" data-i18n="dashboard">Dashboard</a></header><main class="container"><div class="card"><h1 data-i18n="create">New Letter</h1><p class="notice" data-i18n="passwordHint"></p><div class="form"><label class="label" data-i18n="title">Letter title</label><input id="title" class="input" placeholder="To my future self"><div class="two"><div><label class="label" data-i18n="futureDate">Future opening date</label><input id="futureDate" type="date" class="input"></div><div><label class="label" data-i18n="password">Letter password</label><input id="password" type="password" class="input" autocomplete="new-password"><button id="unlockDraft" type="button" class="btn secondary">Unlock saved letter</button></div></div><label class="label" data-i18n="letter">Letter</label><textarea id="letter" class="textarea" placeholder="Write your letter here..."></textarea><label class="label" data-i18n="photos">Photos</label><input id="photos" type="file" accept="image/jpeg,image/png,image/webp" multiple class="input"><div id="preview" class="photo-grid"></div><div class="actions"><button id="save" class="btn secondary">Save draft</button><button id="publish" class="btn primary" data-i18n="publish">Publish letter</button></div><p id="msg" class="notice" hidden></p></div></div></main><script src="js/i18n.js"></script><script src="js/app.js"></script><script type="module">
import {auth,onAuthStateChanged,db,doc,getDoc,addDoc,collection,updateDoc,serverTimestamp} from "./js/firebase.js";
let user, existingId=null, profile=null;const params=new URLSearchParams(location.search);existingId=params.get("id");
onAuthStateChanged(auth,async u=>{if(!u)return location.href="login.html";user=u;profile=(await getDoc(doc(db,"users",u.uid))).data()||{};localStorage.setItem("mfl_lang",profile.language||"bn");applyI18n();if(existingId){const s=await getDoc(doc(db,"letters",existingId));if(!s.exists()||s.data().uid!==u.uid)return location.href="dashboard.html";const x=s.data();title.value=x.title||"";futureDate.value=x.futureDate||"";
if(x.payload){letter.value=""; document.getElementById("msg").hidden=false; document.getElementById("msg").textContent="Enter the same letter password below to unlock your saved encrypted draft for editing."; window.__encryptedPayload=x.payload;}}});
unlockDraft.onclick=async()=>{try{if(!window.__encryptedPayload) return; if(!password.value) throw new Error("Password required"); letter.value=await mfl.decryptText(window.__encryptedPayload,password.value); msg.hidden=false;msg.className="notice success";msg.textContent="Letter unlocked for editing."}catch(e){msg.hidden=false;msg.className="notice error";msg.textContent="Incorrect password or unavailable draft.";}}
async function save(status){if(!title.value.trim()||!letter.value.trim()||!password.value){msg.hidden=false;msg.textContent="Title, letter and password are required.";return}const salt=crypto.randomUUID();const payload=await mfl.encryptText(letter.value,password.value,salt);const base={uid:user.uid,username:profile.username,title:title.value.trim(),futureDate:futureDate.value||"",payload,status,updatedAt:serverTimestamp()};if(existingId)await updateDoc(doc(db,"letters",existingId),base);else{const s=await addDoc(collection(db,"letters"),{...base,createdAt:serverTimestamp()});existingId=s.id}msg.hidden=false;msg.className="notice success";msg.textContent=status==="published"?"Published request saved. GitHub Actions will publish it shortly.":"Draft saved.";if(status==="published")await addDoc(collection(db,"jobs"),{type:"publish_letter",letterId:existingId,uid:user.uid,status:"pending",createdAt:serverTimestamp()})}
save.onclick=()=>save("draft");publish.onclick=()=>save("published");
</script></body></html>
