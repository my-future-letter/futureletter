<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sign in — My Future Letter</title><link rel="stylesheet" href="./css/app.css"></head><body><main class="container"><div class="card auth-card"><div style="text-align:center"><img class="logo-center" src="https://my-future-letter.github.io/futureletter/my-picture/my-future-letter-logo.png"><h1>Welcome to My Future Letter</h1><p class="muted">Sign in with Google to create and manage your letters.</p><button id="google" class="btn primary" style="width:100%">Continue with Google</button><p id="msg" class="error"></p><a class="btn" style="width:100%;margin-top:8px" href="./">Back to home</a></div></div></main><script type="module">import {auth,google,signInWithPopup,onAuthStateChanged} from './js/firebase.js';const b=document.querySelector('#google'),m=document.querySelector('#msg');onAuthStateChanged(auth,u=>{if(u)location.href='dashboard.html'});b.onclick=async()=>{b.disabled=true;b.textContent='Signing in…';try{await signInWithPopup(auth,google);location.href='dashboard.html'}catch(e){m.textContent=e.message||'Could not sign in.';b.disabled=false;b.textContent='Continue with Google'}};</script></body></html>
