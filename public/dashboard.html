<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>My Letters — My Future Letter</title><link rel="stylesheet" href="./css/app.css"><script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.2/jspdf.umd.min.js"></script><script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script><script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script></head><body><header class="container nav"><a class="brand" href="./"><img src="https://my-future-letter.github.io/futureletter/my-picture/my-future-letter-logo.png"><span>My Future Letter<small>Dashboard</small></span></a><div class="nav-actions"><button id="logout" class="btn">Sign out</button></div></header><main class="container section"><div class="two-col"><section><div class="card"><div style="display:flex;justify-content:space-between;gap:12px;align-items:center"><div><h1 id="hello">My letters</h1><p class="muted" id="userline"></p></div><a class="btn primary" href="create.html">+ New Letter</a></div><div id="letters" class="grid" style="margin-top:18px"></div></div></section><aside><div class="card"><h2>My Profile</h2><p><b>Username</b><br><span id="username" class="muted">—</span></p><p><b>Letters</b><br><span id="count" class="stat">0 / 5</span></p><p><b>Photos</b><br><span id="photosCount" class="stat">0 / 25</span></p><div class="notice">Keep your letter password somewhere safe. A forgotten letter password cannot be recovered by the site.</div></div><div class="card" style="margin-top:18px"><h2>My Photo Library</h2><div id="photos" class="photo-grid"></div><p id="noPhotos" class="muted">No photos yet.</p></div></aside></div></main><footer class="footer">My Future Letter</footer><script type="module">import {auth,db,doc,getDoc,collection,query,where,getDocs,deleteDoc,httpsCallable,signOut} from './js/firebase.js';import {APP_CONFIG} from './js/config.js';import {requireAuth,formatDate,toast,esc} from './js/ui.js';const u=await requireAuth(auth);const profileSnap=await getDoc(doc(db,'users',u.uid));if(!profileSnap.exists()){location.href='setup.html';throw 0}const profile=profileSnap.data();document.querySelector('#hello').textContent=`Hello, ${profile.name||u.displayName||'there'}`;document.querySelector('#userline').textContent=`@${profile.username}`;document.querySelector('#username').textContent=profile.username;const lq=await getDocs(query(collection(db,'letters'),where('uid','==',u.uid)));const pq=await getDocs(query(collection(db,'photos'),where('uid','==',u.uid)));document.querySelector('#count').textContent=`${lq.size} / 5`;document.querySelector('#photosCount').textContent=`${pq.size} / 25`;document.querySelector('#letters').innerHTML=lq.empty?'<div class="notice">You have not written a letter yet. Your first one can start with one honest sentence.</div>':lq.docs.map(s=>{const d=s.data();return `<article class="card letter-card"><div style="display:flex;justify-content:space-between;gap:10px"><div><span class="badge">${esc(d.status||'draft')}</span><h3>${esc(d.title||'Untitled Letter')}</h3><p class="muted">For ${esc(d.futureDate||'your future self')} · ${formatDate(d.createdAt)}</p></div></div><div class="toolbar"><a class="btn primary" href="create.html?id=${s.id}">Edit</a>${d.status==='published'?`<a class="btn" target="_blank" href="${APP_CONFIG.githubPagesBase}/futureletter/${encodeURIComponent(profile.username)}.html">Open</a><button class="btn pdf" data-id="${s.id}">PDF</button>`:''}<button class="btn danger delete" data-id="${s.id}">Delete</button></div></article>`}).join('');document.querySelectorAll('.pdf').forEach(b=>b.onclick=async()=>{try{const pw=prompt('Enter your letter password to create the PDF.');if(!pw)return;const d=(await getDoc(doc(db,'letters',b.dataset.id))).data();const {decryptLetter}=await import('./js/security.js');const payload=await decryptLetter(d.encrypted,pw);const box=document.createElement('div');box.className='future-letter';box.style.position='fixed';box.style.left='-10000px';box.style.top='0';box.innerHTML=`<span class="badge">My Future Letter</span><h1>${esc(payload.title)}</h1><div class="meta">From <b>${esc(payload.author)}</b> · For <b>${esc(payload.futureDate)}</b></div><hr><div class="content">${payload.html}</div>`;document.body.appendChild(box);const {downloadA4PDF}=await import('./js/pdf.js');await downloadA4PDF({element:box,author:payload.author,title:payload.title,writtenDate:new Date().toISOString().slice(0,10),futureDate:payload.futureDate,publicUrl:`${APP_CONFIG.githubPagesBase}/futureletter/${profile.username}.html`,letterId:b.dataset.id});box.remove();toast('PDF downloaded.','success')}catch(e){toast(e.message||'Could not create PDF.','error')}});document.querySelectorAll('.delete').forEach(b=>b.onclick=async()=>{if(!confirm('Delete this letter? Your photos will remain in your photo library.'))return;try{await httpsCallable( (await import('./js/firebase.js')).functions,'deleteLetter')({letterId:b.dataset.id});toast('Letter deleted.','success');location.reload()}catch(e){toast(e.message||'Delete failed.','error')}});document.querySelector('#photos').innerHTML=pq.docs.map(s=>{const d=s.data();return `<div class="photo"><img src="${esc(d.url)}"><button title="Delete photo" data-id="${s.id}">×</button></div>`}).join('');if(!pq.size)document.querySelector('#noPhotos').classList.remove('hidden');document.querySelectorAll('#photos button').forEach(b=>b.onclick=async()=>{if(!confirm('Delete this photo from your library and GitHub?'))return;try{await httpsCallable((await import('./js/firebase.js')).functions,'deletePhoto')({photoId:b.dataset.id});toast('Photo deleted.','success');location.reload()}catch(e){toast(e.message||'Delete failed.','error')}});document.querySelector('#logout').onclick=()=>signOut(auth).then(()=>location.href='index.html');</script></body></html>
